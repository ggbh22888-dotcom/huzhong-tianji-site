name: Website Manager - Daily Health

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: Site URL to check
        required: false
        default: https://huzhongtianji.netlify.app
  schedule:
    - cron: "15 23 * * *"

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: audit
        continue-on-error: true
        env:
          MANAGER_SITE_URL: ${{ inputs.site_url || 'https://huzhongtianji.netlify.app' }}
        run: node scripts/website-manager.mjs health --strict
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-manager-report-${{ github.run_number }}
          path: reports/website-manager/
          retention-days: 30
      - if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('reports/website-manager/latest.json', 'utf8'));
            const markdown = fs.readFileSync('reports/website-manager/latest.md', 'utf8');
            const title = '[Website Manager] Site health needs attention';
            const { owner, repo } = context.repo;
            const found = await github.rest.issues.listForRepo({ owner, repo, state: 'all', per_page: 100 });
            const issue = found.data.find(item => item.title === title && !item.pull_request);
            if (report.status === 'healthy') {
              if (issue && issue.state === 'open') {
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: `✅ Site recovered.\n\n${markdown}` });
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
              }
            } else if (issue) {
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'open', body: markdown });
            } else {
              await github.rest.issues.create({ owner, repo, title, body: markdown });
            }
      - if: steps.audit.outcome == 'failure'
        run: exit 1
