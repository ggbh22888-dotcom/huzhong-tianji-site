name: Layout Diagnostic
on:
  pull_request:
    paths: ['.github/workflows/layout-diagnostic.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect source contract and archive relevant public source
        run: |
          mkdir -p reports/layout
          git archive HEAD app/ziwei-chart app/components/PersonForm.js app/layout.js app/globals.css lib/i18n.js public/home.html public/contact.css public/site-continuity.css public/site-continuity.js public/brand-logo.png scripts/test-site-continuity.py .github/workflows/production-smoke.yml > reports/layout/source.tar
          python - <<'PY'
          import re,json
          from pathlib import Path
          js=Path('app/ziwei-chart/ZiweiChartClient.js').read_text()
          css=Path('app/ziwei-chart/ziwei-chart.module.css').read_text()
          used=set(re.findall(r'styles\.([A-Za-z_][A-Za-z0-9_]*)',js))
          defined=set(re.findall(r'\.([A-Za-z_][A-Za-z0-9_-]*)',css))
          result={'used':sorted(used),'missing':sorted(used-defined)}
          Path('reports/layout/class-contract.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          PY
      - run: |
          pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Inspect public pages only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          out=Path('reports/layout'); results=[]
          with sync_playwright() as p:
            b=p.chromium.launch()
            for width,height in [(1440,960),(390,844)]:
              for path in ['/','/ziwei-chart','/pan','/tools','/articles','/classics']:
                c=b.new_context(viewport={'width':width,'height':height},locale='zh-CN',reduced_motion='reduce')
                pg=c.new_page(); errors=[]
                pg.on('pageerror',lambda e:errors.append(str(e)))
                pg.route('**/api/reading',lambda r:r.abort())
                r=pg.goto('https://huzhongtianji.netlify.app'+path,wait_until='networkidle',timeout=45000)
                if path=='/':
                  pg.wait_for_timeout(900)
                  if pg.locator('#hzp-dialog .hzp-close').is_visible(): pg.locator('#hzp-dialog .hzp-close').click()
                data=pg.evaluate('''() => { const box=e=>{const r=e.getBoundingClientRect(),s=getComputedStyle(e);return {tag:e.tagName,cls:e.className,x:r.x,y:r.y,w:r.width,h:r.height,font:s.fontSize,color:s.color,bg:s.backgroundColor,display:s.display,maxWidth:s.maxWidth}};return {viewport:innerWidth,scrollWidth:document.documentElement.scrollWidth,main:[...document.querySelectorAll('main')].map(box),header:[...document.querySelectorAll('header')].map(box),headings:[...document.querySelectorAll('h1')].map(box),images:[...document.images].slice(0,4).map(box),inputs:[...document.querySelectorAll('input,select')].slice(0,4).map(box)} }''')
                results.append({'path':path,'width':width,'status':r.status,'layout':data,'errors':errors})
                pg.screenshot(path=str(out/(('home' if path=='/' else path[1:])+'-'+str(width)+'-before.png')),full_page=path=='/ziwei-chart')
                c.close()
            b.close()
          (out/'live-layout.json').write_text(json.dumps(results,ensure_ascii=False,indent=2))
          print(json.dumps(results,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-diagnostic
          path: reports/layout/
          retention-days: 7
