name: Website Manager - Weekly Backup

on:
  workflow_dispatch:
  schedule:
    - cron: "45 22 * * 0"

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create backup bundle
        run: |
          mkdir -p backup
          git bundle create "backup/huzhong-tianji-${GITHUB_RUN_ID}.bundle" --all
          tar -czf "backup/huzhong-tianji-source-${GITHUB_RUN_ID}.tar.gz" \
            app lib public manager scripts content package.json package-lock.json netlify.toml next.config.js README.md
      - uses: actions/upload-artifact@v4
        with:
          name: huzhong-tianji-backup-${{ github.run_number }}
          path: backup/
          retention-days: 30
