name: Prepare Authorised Release Fix
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/prepare-release-fix.yml']
permissions:
  contents: read
jobs:
  prepare:
    if: github.event.pull_request.number == 6 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/original-site-continuity'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply narrowly scoped release dependency fix
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.dependencies.next = '15.5.24';
          p.dependencies.react = '19.3.1';
          p.dependencies['react-dom'] = '19.3.1';
          p.overrides = { ...(p.overrides || {}), postcss: '8.5.23' };
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          const file = 'app/articles/[slug]/page.js';
          let text = fs.readFileSync(file, 'utf8');
          if (!text.includes('export function generateMetadata({ params })') || !text.includes('export default function ArticlePage({ params })')) throw new Error('Article implementation changed; inspect before upgrading.');
          text = text.replace('export function generateMetadata({ params }) {', 'export async function generateMetadata({ params }) {');
          text = text.replace('export default function ArticlePage({ params }) {', 'export default async function ArticlePage({ params }) {');
          text = text.replaceAll('getArticle(params.slug)', 'getArticle((await params).slug)');
          fs.writeFileSync(file, text);
          NODE
          npm install --package-lock-only --ignore-scripts
          npm ci
      - name: Validate dependency fixes and original website
        run: |
          npm audit --omit=dev --audit-level=high
          npm run manager:check
          git diff --exit-code -- lib public/contact.js public/contact.css public/brand-logo.png public/privacy.html public/terms.html app/pan
      - name: Run browser regression suite without paid AI calls
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          npm run start > /tmp/hztj-release.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 2
          done
          python scripts/test-site-continuity.py
          curl -fsS http://127.0.0.1:3000/articles/bazi-is-a-manual-not-a-verdict > /dev/null
      - name: Commit only tested dependency and compatibility changes
        run: |
          git config user.name 'Huzhong Tianji Website Manager'
          git config user.email 'actions@users.noreply.github.com'
          git add package.json package-lock.json 'app/articles/[slug]/page.js'
          git diff --cached --stat
          git commit -m 'security: update Next.js and PostCSS; retain existing website features'
          git push origin HEAD:refs/heads/feature/original-site-continuity
          echo "Release fix commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authorised-release-regression-${{ github.run_number }}
          path: reports/site-continuity/
          retention-days: 14
